name: mine
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: mine
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests yt-dlp Pillow
      - run: python -u scripts/collect.py
        # Pass 12: cap the harvest so the commit step always gets to run inside the 60-min job limit
        timeout-minutes: 50
        continue-on-error: true
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - if: always()
        run: |
          git config user.name "miner-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finds; git diff --cached --quiet && exit 0
          git commit -m "mining log: $(date -u +%FT%TZ)"
          # Pass 12: main may have moved during the ~40 min run; merge (harvest wins on conflicts) and retry instead of losing the run
          for i in 1 2 3; do git push && exit 0; git pull --no-rebase --no-edit -X ours || exit 1; done; exit 1
