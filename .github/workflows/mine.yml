name: mine
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: mine
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests yt-dlp
      - run: python scripts/collect.py
      - run: |
          git config user.name "miner-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finds.json; git diff --cached --quiet || (git commit -m "mining log: $(date -u +%FT%TZ)" && git push)
